# SwiftLint Configuration - Pragmatic Settings
# Focus on real issues, not style preferences

# ============================================
# EXCLUDED PATHS
# ============================================
excluded:
  - Pods
  - Carthage
  - .build
  - build
  - DerivedData
  - vendor
  - fastlane
  - "**/.build"
  - "**/Generated"

# ============================================
# ANALYZER RULES (Catch real bugs)
# ============================================
analyzer_rules:
  - unused_declaration
  - unused_import

# ============================================
# ENABLED RULES (Only Important Ones)
# ============================================
opt_in_rules:
  # Performance (actual improvements)
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - empty_count
  - first_where
  - last_where

  # Safety (prevent crashes/bugs)
  - fatal_error_message

  # Unused code detection
  - unused_closure_parameter
  - unused_control_flow_label
  - unused_enumerated
  - unused_optional_binding
  - unused_setter_value

# ============================================
# DISABLED RULES (Too opinionated/noisy)
# ============================================
disabled_rules:
  - todo
  - trailing_comma
  - identifier_name
  - explicit_acl  # Too noisy
  - explicit_top_level_acl  # Too noisy
  - explicit_type_interface  # Let Swift infer types
  - explicit_enum_raw_value
  - multiline_arguments  # Let developers decide
  - multiline_function_chains  # Let developers decide
  - multiline_parameters
  - conditional_returns_on_newline
  - closure_spacing
  - vertical_whitespace_opening_braces
  - vertical_whitespace_closing_braces
  - number_separator  # Not critical

# ============================================
# LINE LENGTH (Relaxed)
# ============================================
line_length:
  warning: 150
  error: 200
  ignores_comments: true
  ignores_urls: true

# ============================================
# FILE LENGTH (Relaxed)
# ============================================
file_length:
  warning: 600
  error: 1000
  ignore_comment_only_lines: true

# ============================================
# FUNCTION BODY LENGTH (Relaxed)
# ============================================
function_body_length:
  warning: 80
  error: 150

# ============================================
# TYPE BODY LENGTH (Relaxed)
# ============================================
type_body_length:
  warning: 400
  error: 600

# ============================================
# CYCLOMATIC COMPLEXITY (Relaxed)
# ============================================
cyclomatic_complexity:
  warning: 15
  error: 25
  ignores_case_statements: true

# ============================================
# NESTING (Relaxed)
# ============================================
nesting:
  type_level:
    warning: 3
  function_level:
    warning: 5

# ============================================
# FUNCTION PARAMETER COUNT (Relaxed)
# ============================================
function_parameter_count:
  warning: 8
  error: 10

# ============================================
# LARGE TUPLE (Relaxed)
# ============================================
large_tuple:
  warning: 4
  error: 6

# ============================================
# CLOSURE BODY LENGTH (Relaxed)
# ============================================
closure_body_length:
  warning: 80
  error: 150

# ============================================
# VERTICAL WHITESPACE (Relaxed)
# ============================================
vertical_whitespace:
  max_empty_lines: 2